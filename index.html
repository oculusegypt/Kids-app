<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff9ed" />
    <meta
      name="description"
      content="رحلة سارة التعليمية — أنشطة تفاعلية ممتعة للأطفال"
    />
    <title>رحلة سارة التعليمية</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./screen-map.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" type="button" data-reference-screen="home" aria-label="الرئيسية">
          <img src="./Untitled%20(5)/Brand%20mark.png" alt="" />
          <img class="brand-name" src="./Untitled%20(5)/Brand%20name.png" alt="رحلة سارة التعليمية" />
        </button>
        <div class="topbar-actions">
          <button class="icon-button notification-button" type="button" aria-label="الإشعارات">
            ♡
            <span class="notification-dot"></span>
          </button>
          <button class="profile-button" type="button" data-reference-screen="profile" aria-label="الملف الشخصي">
            <img src="./Untitled%20(5)/Profile%20avatar.png" alt="" />
          </button>
        </div>
      </header>

      <main id="app" class="main-content" tabindex="-1"></main>

      <nav class="bottom-nav" aria-label="التنقل الرئيسي">
        <button class="nav-item is-active" type="button" data-reference-screen="home">
          <img src="./Untitled%20(5)/Home%20icon.png" alt="" /><small>الرئيسية</small>
        </button>
        <button class="nav-item" type="button" data-reference-screen="books">
          <img src="./Untitled%20(5)/Book%20icon.png" alt="" /><small>كتبي</small>
        </button>
        <button class="nav-item" type="button" data-reference-screen="games">
          <img src="./Untitled%20(5)/Activities%20star.png" alt="" /><small>أنشطتي</small>
        </button>
        <button class="nav-item" type="button" data-reference-screen="achievements">
          <img src="./Untitled%20(5)/Achievements%20trophy.png" alt="" /><small>إنجازاتي</small>
        </button>
      </nav>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
